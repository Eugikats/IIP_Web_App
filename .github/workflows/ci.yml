name: CI

# Validation gates for IIP (AGENTS.md §24), matched to what the repo actually contains.
# Backend: build + test + vulnerable-package scan. Portal: lint + hygiene checks + build.
# Infra: bicep compile of the files that exist. No secrets, no deployment.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Config injection guard
        run: bash scripts/guard/check-config-injection.sh .

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: |
          bash scripts/guard/check-config-injection.sh .
          dotnet restore InsuranceIntelligence.sln

      - name: Build
        run: |
          bash scripts/guard/check-config-injection.sh .
          dotnet build InsuranceIntelligence.sln --no-restore -c Release

      - name: Test
        run: |
          bash scripts/guard/check-config-injection.sh .
          dotnet test InsuranceIntelligence.sln --no-build -c Release --verbosity normal

      - name: Vulnerable package scan (report-only)
        continue-on-error: true
        run: dotnet list InsuranceIntelligence.sln package --vulnerable --include-transitive

  portal:
    name: Portal (lint + checks + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/portal
    steps:
      - uses: actions/checkout@v4

      - name: Config injection guard
        run: bash ../../scripts/guard/check-config-injection.sh ../..

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/portal/pnpm-lock.yaml

      - name: Install
        run: |
          bash ../../scripts/guard/check-config-injection.sh ../..
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          bash ../../scripts/guard/check-config-injection.sh ../..
          pnpm lint

      - name: Runtime-data / provider / role / release-gate checks
        run: |
          bash ../../scripts/guard/check-config-injection.sh ../..
          pnpm test

      - name: Build
        run: |
          bash ../../scripts/guard/check-config-injection.sh ../..
          pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:5167
          NEXT_PUBLIC_AUTH_MODE: Development
          NEXT_PUBLIC_RUNTIME_PROFILE: Development

      - name: Install release-gate browser
        run: |
          bash ../../scripts/guard/check-config-injection.sh ../..
          pnpm exec playwright install --with-deps chromium

      - name: Release 1 browser gates
        run: |
          bash ../../scripts/guard/check-config-injection.sh ../..
          pnpm test:release-gates

  infra:
    name: Infra (bicep compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Config injection guard
        run: bash scripts/guard/check-config-injection.sh .

      - name: Compile Bicep templates
        run: |
          bash scripts/guard/check-config-injection.sh .
          az bicep install
          bash scripts/guard/check-config-injection.sh .
          az bicep build --file infra/bicep/phase3-dev-foundation.bicep
          bash scripts/guard/check-config-injection.sh .
          az bicep build --file infra/bicep/phase6-functions-runtime.bicep
          bash scripts/guard/check-config-injection.sh .
          az bicep build --file infra/mainTemplate.bicep
          bash scripts/guard/check-config-injection.sh .
          az bicep build --file infra/modules/compute/functionapp.bicep
          bash scripts/guard/check-config-injection.sh .
          az bicep build --file infra/modules/messaging/servicebus.bicep
