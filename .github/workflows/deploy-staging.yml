name: Deploy Staging (existing Azure resources)

# Publishes the v2 API + portal to the EXISTING staging App Services that were
# provisioned for the original repo. This workflow deploys application code only — it
# NEVER creates/modifies Azure infrastructure and NEVER touches Partner Center or the
# published Marketplace managed-application package (infra/mainTemplate.bicep). Runtime
# configuration (INSURANCEINTELLIGENCE_* app settings pointing at the existing resources)
# is applied out-of-band via infra/scripts/set-staging-appsettings.sh — see
# docs/05-deployment-release-enablement/iip_gate2_staging_deploy_reuse_existing_resources.md.
#
# Trigger is manual only (workflow_dispatch): deploys are an explicit, approved action.

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: "Deploy the API App Service"
        type: boolean
        default: true
      deploy_portal:
        description: "Deploy the Portal App Service"
        type: boolean
        default: true

# Identifiers (not secrets) for the EXISTING staging resources being reused.
#
# WO-22 (docs/08-program-plan/IIP_PRODUCTION_BUILD_CONTRACT.md): these names were flagged
# as possibly targeting App Services that no longer exist in any subscription. No Azure CLI
# access was available in that session to confirm current resource names, so a guard step
# below fails each job immediately with instructions rather than let a deploy attempt run
# deep into `azure/webapps-deploy` against a possibly-dead target. To re-enable: confirm the
# real App Service names with someone who has subscription access, update API_APP_NAME/
# PORTAL_APP_NAME below if they changed, then delete the "Guard" step from the job(s) you
# confirmed.
env:
  API_APP_NAME: app-api-stg-cus-vyhhymwydvai2
  PORTAL_APP_NAME: app-portal-stg-cus-vyhhymwydvai2
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20"

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-api:
    if: ${{ inputs.deploy_api }}
    runs-on: ubuntu-latest
    steps:
      - name: Guard against unverified staging resource name
        run: |
          echo "::error::deploy-staging.yml (job deploy-api) is disabled pending manual confirmation that App Service '${{ env.API_APP_NAME }}' still exists (WO-22). Confirm with subscription access, update API_APP_NAME above if it changed, then delete this guard step."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish src/InsuranceIntelligence.Api/InsuranceIntelligence.Api.csproj -c Release -o ${{ github.workspace }}/api-publish

      # Deploys to the EXISTING API App Service using its publish profile
      # (GitHub secret AZURE_API_PUBLISH_PROFILE). The profile encodes the target app.
      - name: Deploy API to existing App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/api-publish

  deploy-portal:
    if: ${{ inputs.deploy_portal }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/portal
    # NEXT_PUBLIC_* values are baked at build time. Supply them as repository/environment
    # VARIABLES (non-secret identifiers) so the portal points at the existing resources.
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.IIP_PORTAL_API_BASE_URL }}
      NEXT_PUBLIC_AUTH_MODE: Entra
      NEXT_PUBLIC_RUNTIME_PROFILE: Staging
      NEXT_PUBLIC_ENTRA_TENANT_ID: ${{ vars.IIP_ENTRA_TENANT_ID }}
      NEXT_PUBLIC_ENTRA_CLIENT_ID: ${{ vars.IIP_PORTAL_ENTRA_CLIENT_ID }}
      NEXT_PUBLIC_ENTRA_API_SCOPE: ${{ vars.IIP_ENTRA_API_SCOPE }}
      NEXT_PUBLIC_ENTRA_REDIRECT_URI: ${{ vars.IIP_ENTRA_REDIRECT_URI }}
    steps:
      - name: Guard against unverified staging resource name
        run: |
          echo "::error::deploy-staging.yml (job deploy-portal) is disabled pending manual confirmation that App Service '${{ env.PORTAL_APP_NAME }}' still exists (WO-22). Confirm with subscription access, update PORTAL_APP_NAME above if it changed, then delete this guard step."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/portal/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (standalone)
        run: pnpm build

      # Assemble the Next.js standalone bundle: server.js lives at the .next/standalone root,
      # static assets and /public must be copied alongside it.
      #
      # This step previously located the server with `find deploy -maxdepth 3 -name server.js |
      # head -1`. That matches node_modules/next/server.js (sorted before the real one) and copied
      # Next's package internals over the bundle root, producing a server.js that starts nothing
      # and exits 0. The standalone root is a known path, so it is used directly and asserted.
      #
      # pnpm's traced node_modules is also NOT shipped: it is a .pnpm store plus symlinks, and
      # symlinks do not survive zipping, so the App Service receives a half-dereferenced tree and
      # Next dies on "Cannot find module 'styled-jsx/package.json'". Dependencies are installed
      # flat with npm from the standalone package.json, which is self-contained by design.
      - name: Assemble standalone bundle
        run: |
          set -e
          rm -rf deploy && mkdir -p deploy
          cp -r .next/standalone/. deploy/   # `/.` copies the hidden .next/ (BUILD_ID, server/) too
          rm -rf deploy/node_modules
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi
          ( cd deploy && npm install --omit=dev --no-audit --no-fund --ignore-scripts --silent )

      - name: Verify bundle
        run: |
          set -e
          fail() { echo "ERROR: $1" >&2; exit 1; }
          [ -f deploy/server.js ] || fail "server.js missing from bundle root"
          grep -q "currentPort" deploy/server.js || fail "root server.js is not the Next standalone server"
          [ -f deploy/.next/BUILD_ID ] || fail ".next/BUILD_ID missing — Next will refuse to start"
          [ -d deploy/.next/server ] || fail ".next/server missing — Next will refuse to start"
          [ -d deploy/.next/static ] || fail ".next/static missing"
          [ -f deploy/node_modules/next/package.json ] || fail "node_modules/next missing"
          [ -f deploy/node_modules/styled-jsx/package.json ] \
            || [ -f deploy/node_modules/next/node_modules/styled-jsx/package.json ] \
            || fail "styled-jsx not resolvable from next"
          [ -e deploy/amp.js ] && fail "Next package internals leaked into the bundle root"
          find deploy -type l | head -1 | grep -q . && fail "bundle contains symlinks; they will not survive zipping"
          echo "bundle verified"

      # Deploys to the EXISTING Portal App Service. Its startup command must be
      # `node server.js` (set once — see the deploy runbook).
      - name: Deploy Portal to existing App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.PORTAL_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PORTAL_PUBLISH_PROFILE }}
          package: web/portal/deploy
