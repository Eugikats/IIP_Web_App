<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IIP prototype</title>
<!-- Optional: Inter loads if you are online; the page works offline with system fonts. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F7F9; --surface:#fff; --surface-2:#FAFBFC; --border:#E4E7EC; --border-strong:#D0D5DD;
  --text:#101828; --text-2:#475467; --muted:#98A2B3;
  --primary:#1769FF; --primary-soft:#EAF1FF; --primary-ink:#0B4FCC;
  --ok:#12B76A; --warn:#F79009; --bad:#D92D20; --info:#1769FF;
  --r-control:8px; --r-card:12px; --r-pill:999px;
  --rail:64px; --rail-open:232px;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:14px;height:14px}
svg.i.lg{width:22px;height:22px}
.sr{position:absolute;left:-9999px}

/* prototype bar */
#protobar{position:sticky;top:0;z-index:60;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:7px 14px;background:#101828;color:#D0D5DD;font-size:12px}
#protobar b{color:#fff;font-weight:600}
#protobar select,#protobar button{background:#1D2939;color:#fff;border:1px solid #344054;border-radius:6px;padding:3px 8px;font-size:12px}
#protobar label{display:flex;gap:6px;align-items:center}
#protobar .grow{flex:1}
#protobar .legend span{margin-left:8px}

/* shell */
.shell{display:flex;height:calc(100vh - 36px);min-height:560px}
.rail{width:var(--rail);flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px 12px;gap:4px;overflow-y:auto;transition:width .12s}
.rail.open{width:var(--rail-open)}
.rail .logo{display:flex;align-items:center;gap:10px;height:40px;margin-bottom:6px;font-weight:700;letter-spacing:-.01em}
.rail .logo .mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.rail .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 6px 2px;display:none}
.rail.open .grp{display:block}
.rail .sep{height:1px;background:var(--border);margin:8px 4px}
.rail.open .sep{display:none}
.nav{display:flex;align-items:center;gap:10px;height:40px;width:40px;justify-content:center;border:0;background:transparent;border-radius:var(--r-control);color:var(--text-2);flex:none}
.rail.open .nav{width:100%;justify-content:flex-start;padding:0 10px}
.nav span{display:none;font-weight:600;font-size:13px;white-space:nowrap}
.rail.open .nav span{display:inline}
.nav:hover{background:var(--bg)}
.nav.active{background:var(--primary-soft);color:var(--primary)}
.nav:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.rail .spacer{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-weight:700;font-size:12px;border:0;flex:none}
.avatar.lg{width:56px;height:56px;font-size:18px}
.avatar.sm{width:28px;height:28px;font-size:11px}
.avatar.gray{background:#EEF0F3;color:var(--text-2)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.topbar .crumb{color:var(--muted);font-size:13px}
.topbar .sp{flex:1}
.envpill{font-size:12px;color:var(--text-2);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px 10px;background:var(--surface-2)}
.content{flex:1;overflow-y:auto;padding:24px 24px 110px}
.col{max-width:1120px}
.col.wide{max-width:1280px}
.head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.head h1{margin:0;font-size:22px;letter-spacing:-.015em;font-weight:650}
.head p{margin:3px 0 0;color:var(--text-2);max-width:720px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}

/* chat bar */
.chatbar{position:absolute;left:0;right:0;bottom:0;padding:12px 24px 16px;background:var(--bg);border-top:1px solid var(--border);pointer-events:none}
.chatbar .inner{pointer-events:auto;max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-pill);padding:8px 8px 8px 16px}
.chatbar input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.orb{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#8FB8FF,#1769FF 60%,#0B4FCC);flex:none}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-control);padding:7px 13px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-ink)}
.btn.danger{color:var(--bad);border-color:#F3C1BC}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled],.btn.off{opacity:.5;cursor:not-allowed}
.icon-btn{width:34px;height:34px;border:1px solid transparent;background:transparent;border-radius:var(--r-control);display:grid;place-items:center;color:var(--text-2)}
.icon-btn:hover{background:var(--bg)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-weight:600;font-size:13px}
.field .hint{color:var(--muted);font-size:12px}
.in,.sel,.ta{border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-control);padding:8px 11px;min-width:0;width:100%}
.in.ro{background:var(--surface-2);color:var(--text-2)}
.ta{min-height:84px;resize:vertical}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1;min-width:200px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-control);padding:0 11px;height:36px;flex:1;min-width:200px}
.search input{border:0;outline:0;flex:1;background:transparent;min-width:0}
.toggle{width:38px;height:22px;border-radius:var(--r-pill);background:var(--border-strong);border:0;position:relative;flex:none;padding:0}
.toggle:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .12s}
.toggle.on{background:var(--primary)}
.toggle.on:after{left:18px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:18px;margin-bottom:16px}
.card.flush{padding:0;overflow:hidden}
.card h2,.card h3{margin:0 0 4px;font-size:15px;font-weight:650}
.card .sub{color:var(--text-2);font-size:13px;margin-bottom:12px}
.card .ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.card .ch h3{margin:0}
.card .cb{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:900px){.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:14px 16px}
.kpi .l{color:var(--text-2);font-size:12.5px}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:600}
.list .s{color:var(--text-2);font-size:12.5px}
.clickable{cursor:pointer}
.clickable:hover{background:var(--surface-2)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
table.t td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.clickable:hover{background:var(--surface-2)}
.scroll-x{overflow-x:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-control);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);border:1px solid var(--border)}

/* status: neutral pill + 6px dot + word */
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-pill);padding:2px 9px;font-size:12px;font-weight:600;color:var(--text);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.info{background:var(--info)}
/* tinted pills: only the Acquisition dashboard and the Inbox, which are ported from CIP */
.pill.t-blue{background:#E8F0FF;border-color:#D4E2FF;color:#0B4FCC}
.pill.t-green{background:#E6F6EE;border-color:#CDEBDB;color:#067647}
.pill.t-amber{background:#FEF3E0;border-color:#FBE2B8;color:#B54708}
.pill.t-gray{background:#F2F4F7;border-color:#E4E7EC;color:#475467}
.pill.t-red{background:#FDECEA;border-color:#F8CFCB;color:#B42318}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:middle}
.tag.iip{background:#EEF0F3;color:#475467}.tag.cip{background:#E8F0FF;color:#0B4FCC}.tag.new{background:#FEF3E0;color:#B54708}
body.noann .tag,body.noann .annot{display:none}
body.noprop .proposed{display:none}
.annot{font-size:12px;color:var(--muted);margin:-8px 0 14px}

/* AI vs human separation */
.ai{border:1px solid var(--border);border-left:3px solid var(--primary);background:var(--surface);border-radius:var(--r-card);padding:16px 18px;margin-bottom:16px}
.ai .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--primary);display:flex;gap:6px;align-items:center;margin-bottom:8px}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border:1px solid var(--border-strong);border-radius:5px;font-size:11px;font-weight:700;color:var(--primary);background:var(--surface);margin:0 2px;vertical-align:1px}
.decision{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:var(--r-card);padding:16px 18px;margin-bottom:16px}
.decision .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--text-2);margin-bottom:8px}
.note{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-control);padding:10px 12px;color:var(--text-2);font-size:13px;margin-bottom:14px}
.note.warn{border-color:#FBE2B8;background:#FFFAEB}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary)}
.stage{display:flex;gap:0;margin-bottom:16px;flex-wrap:wrap}
.stage div{flex:1;min-width:110px;padding:10px 12px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-2)}
.stage div+div{border-left:0}
.stage div.done{color:var(--text)}
.stage div.cur{background:var(--primary-soft);color:var(--primary);border-color:#C9DBFF}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding:8px 4px 0}
.chart .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart .b i{width:100%;max-width:46px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#8FB8FF,#1769FF)}
.chart .b span{font-size:11px;color:var(--text-2);text-align:center}
.spark{height:34px;width:100%}

/* states */
.statebox{border:1px dashed var(--border-strong);border-radius:var(--r-card);padding:44px 20px;text-align:center;background:var(--surface)}
.statebox h3{margin:10px 0 4px;font-size:16px}
.statebox p{margin:0 auto 14px;color:var(--text-2);max-width:460px}
.skel{height:14px;border-radius:5px;background:#EEF0F3;margin:10px 0}

/* settings modal and popovers */
.scrim{position:fixed;inset:36px 0 0 0;background:rgba(16,24,40,.45);z-index:40;display:grid;place-items:center;padding:24px}
.modal{background:var(--surface);border-radius:16px;width:min(1040px,100%);height:min(720px,100%);display:flex;overflow:hidden;border:1px solid var(--border)}
.modal .side{width:248px;flex:none;border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto;background:var(--surface-2)}
.modal .side h2{font-size:15px;margin:2px 8px 12px;display:flex;gap:8px;align-items:center}
.modal .side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:var(--r-control);font-weight:600;color:var(--text-2)}
.modal .side button.on{background:var(--primary-soft);color:var(--primary)}
.modal .side button:hover:not(.on){background:var(--bg)}
.modal .body{flex:1;min-width:0;display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 12px}
.modal .mh h2{margin:0;font-size:20px}
.modal .mh p{margin:3px 0 0;color:var(--text-2)}
.modal .mb{flex:1;overflow-y:auto;padding:4px 24px 24px}
@media(max-width:760px){.modal{flex-direction:column}.modal .side{width:auto;border-right:0;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:8px}.modal .side h2{display:none}.modal .side button{width:auto;white-space:nowrap}}
.menu{position:fixed;left:70px;bottom:16px;width:280px;max-height:calc(100vh - 80px);overflow-y:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.14);z-index:50;padding:8px}
.menu .gl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left;font-weight:600;color:var(--text-2)}
.menu button:hover{background:var(--bg)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.drawer{position:fixed;right:0;top:36px;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--border-strong);z-index:45;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(16,24,40,.08)}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.drawer .db{flex:1;overflow-y:auto;padding:16px}
.drawer .df{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.msg{max-width:86%;margin-bottom:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2)}
.msg.me{margin-left:auto;background:var(--primary-soft);border-color:#C9DBFF}
.msg.in{background:#fff}
.msg .meta{font-size:11px;color:var(--muted);margin-top:4px}
.proposal{border:1px solid var(--border-strong);border-radius:10px;background:#fff;padding:12px;margin-top:8px}
.proposal .pl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);font-weight:700;margin-bottom:6px}
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:0;border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);overflow:hidden;height:600px}
.inbox>div{overflow-y:auto}
.inbox .cl{border-right:1px solid var(--border)}
.inbox .ci{border-left:1px solid var(--border)}
.conv{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.conv:hover,.conv.on{background:var(--primary-soft)}
.bubble{max-width:78%;padding:10px 13px;border-radius:14px;margin:6px 0;border:1px solid var(--border);background:#fff}
.bubble.out{margin-left:auto;background:var(--primary-soft);border-color:#C9DBFF}
.bubble .who{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px}
@media(max-width:900px){.inbox{grid-template-columns:1fr;height:auto}.inbox .ci{border-left:0;border-top:1px solid var(--border)}}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--text-2)}.kv dd{margin:0;font-weight:600}
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps div{flex:1;min-width:120px;font-size:12px;font-weight:600;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2)}
.steps div.cur{border-color:#C9DBFF;background:var(--primary-soft);color:var(--primary)}
.steps div.done{color:var(--text)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.check:last-child{border-bottom:0}
.check .box{width:18px;height:18px;border-radius:5px;border:1px solid var(--border-strong);display:grid;place-items:center;flex:none;margin-top:1px;background:#fff}
.check .box.on{background:var(--primary);border-color:var(--primary);color:#fff}
.login{min-height:calc(100vh - 36px);display:grid;place-items:center;background:var(--surface);padding:24px}
.login .box{width:min(400px,100%);border:1px solid var(--border);border-radius:16px;padding:28px}
.login .ms{width:100%;justify-content:center;background:#0B1B3A;color:#fff;border-color:#0B1B3A;padding:11px}
.login .gg{width:100%;justify-content:center;padding:11px;margin-top:10px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.right{text-align:right}
.mt{margin-top:14px}.mb0{margin-bottom:0}
.muted{color:var(--text-2)}.faint{color:var(--muted)}
.hide{display:none!important}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   IIP prototype: core. Plain JS, no build step, no network needed.
   Edit the screens in part 3 and 4 (search for "R.", one entry per screen).
   ===================================================================== */
const ICONS = {
  home:"M3 11l9-8 9 8M5 10v10h14V10M9 20v-6h6v6",
  claims:"M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M10 14a2 2 0 104 0 2 2 0 00-4 0M13.5 15.5L16 18",

/* ---------- small building blocks ---------- */
const pill = (txt, tone = "", tint = "") => `<span class="pill ${tint}">${tone ? `<i class="dot ${tone}"></i>` : ""}${txt}</span>`;
const tag = (kind) => `<span class="tag ${kind}">${{ iip: "In IIP now", cip: "From CIP", new: "Proposed" }[kind]}</span>`;
const btn = (label, o = {}) => `<button class="btn ${o.kind || ""} ${o.cls || ""}" ${o.go ? `data-go="${o.go}"` : ""} ${o.act ? `data-act="${o.act}"` : ""} ${o.set ? `data-settings="${o.set}"` : ""}>${o.icon ? ic(o.icon, "sm") : ""}${label}</button>`;
const card = (title, body, o = {}) => `<section class="card ${o.cls || ""}">${title ? `<div class="${o.flush ? "ch" : ""}"><h3>${title}</h3>${o.sub ? `<div class="sub mb0">${o.sub}</div>` : ""}</div>` : ""}${o.flush ? body : body}</section>`;
const kpi = (l, v, d = "") => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${d ? `<div class="d">${d}</div>` : ""}</div>`;
const field = (label, val = "", o = {}) => `<div class="field"><label>${label}</label>${o.type === "select" ? `<select class="sel">${(o.options || []).map(x => `<option ${x === val ? "selected" : ""}>${x}</option>`).join("")}</select>` : o.type === "area" ? `<textarea class="ta">${val}</textarea>` : `<input class="in ${o.ro ? "ro" : ""}" value="${val}" ${o.ro ? "readonly" : ""} placeholder="${o.ph || ""}">`}${o.hint ? `<div class="hint">${o.hint}</div>` : ""}</div>`;
const toggle = (key, on) => `<button class="toggle ${(S.flags[key] ?? on) ? "on" : ""}" data-toggle="${key}" data-on="${on ? 1 : 0}" role="switch" aria-checked="${(S.flags[key] ?? on)}" aria-label="${key}"></button>`;
const tabs = (group, items, def) => { const cur = S.tabs[group] || def || items[0][0]; return { cur, html: `<div class="tabs" role="tablist">${items.map(([k, l]) => `<button role="tab" class="${k === cur ? "on" : ""}" data-tab="${group}:${k}">${l}</button>`).join("")}</div>` }; };
const table = (cols, rows, o = {}) => `<div class="scroll-x"><table class="t"><thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr class="${r.go ? "clickable" : ""}" ${r.go ? `data-go="${r.go}"` : ""}>${r.cells.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const note = (txt, warn) => `<div class="note ${warn ? "warn" : ""}">${ic(warn ? "alert" : "shieldcheck")}<div>${txt}</div></div>`;
const check = (on, title, sub = "") => `<div class="check"><span class="box ${on ? "on" : ""}">${on ? ic("check", "sm") : ""}</span><div><div style="font-weight:600">${title}</div>${sub ? `<div class="muted" style="font-size:12.5px">${sub}</div>` : ""}</div></div>`;
const list = (items) => `<ul class="list">${items.map(i => `<li class="${i.go ? "clickable" : ""}" ${i.go ? `data-go="${i.go}"` : ""}>${i.lead || ""}<div class="grow"><div class="t">${i.t}</div>${i.s ? `<div class="s">${i.s}</div>` : ""}</div>${i.end || ""}</li>`).join("")}</ul>`;
const bars = (pts) => { const m = Math.max(...pts.map(p => p[1])); return `<div class="chart" role="img" aria-label="Bar chart">${pts.map(p => `<div class="b"><i style="height:${Math.round(p[1] / m * 100)}%"></i><span>${p[0]}<br><b>${p[1]}</b></span></div>`).join("")}</div>`; };
const spark = (c = "#12B76A") => `<svg class="spark" viewBox="0 0 120 34" preserveAspectRatio="none"><path d="M0 28 L18 27 L34 29 L52 26 L70 12 L84 24 L100 20 L120 6" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/></svg>`;

const stateBox = (kind, what) => {
  const m = {
    loading: ["", "", ""],
    empty: [ic("folder", "lg"), `Nothing in ${what} yet`, "When there is something to show, it appears here, ranked by what needs you most."],
    filter: [ic("filter", "lg"), "Nothing matches these filters", "Clear a filter or change the search to see more."],
    error: [ic("alert", "lg"), `${what} could not be loaded`, "The service did not answer. Nothing was changed. Try again in a moment."],
    notconfigured: [ic("plug", "lg"), "Not configured", `${what} has not been set up for this workspace. An administrator can connect it under Settings, Integrations.`],
    nopermission: [ic("lock", "lg"), "No permission", `Your role cannot see ${what}. Ask a workspace administrator if you need access.`]
  }[kind];
  if (kind === "loading") return `<div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:70%"></div><div class="skel"></div></div>`;

};

function routeOf(hash) { const p = (hash || "").replace(/^#\/?/, "").split("/"); return { route: p[0] || "brief", params: { id: p[1] } }; }
function go(route, id) { location.hash = "#/" + route + (id ? "/" + id : ""); }
function activeRail(route) {
  const map = { claim: "claims", newclaim: "claims", customer: "customers", operatoraccount: "operator", operatorinvoices: "operator", operatorbilling: "operator", operatoronboard: "operator", operatorinvoice: "operator" };
  return map[route] || route;
}
function shell(inner, r) {
  const a = activeRail(S.route);
  const nav = ([k, l, i]) => `<button class="nav ${a === k ? "active" : ""}" data-go="${k}" title="${l}" aria-label="${l}">${ic(i)}<span>${l}</span></button>`;
  return `
  <div class="shell">
    <aside class="rail ${S.rail ? "open" : ""}" aria-label="Primary">
      <div class="logo"><span class="mark">IIP</span>${S.rail ? "<span>IIP Operations</span>" : ""}</div>
      ${RAIL.map(([g, items]) => `<div class="grp">${g}</div>${items.map(nav).join("")}${g === "Work" ? '<div class="sep"></div>' : ""}`).join("")}
      <div class="spacer"></div>
      <button class="nav" data-act="rail" title="Expand navigation" aria-label="Expand navigation">${ic("panel")}<span>Collapse</span></button>
      <button class="nav" data-act="menu" aria-label="Profile menu" title="Profile menu"><span class="avatar sm" style="display:grid">GT</span><span>Grace Tendo</span></button>
    </aside>
    <div class="main">
      <div class="topbar"><span class="crumb">${r.group || "IIP Operations"}</span><span class="sp"></span><span class="envpill">Demo environment, sample content</span><button class="icon-btn" data-act="notify" aria-label="Notifications">${ic("bell")}</button><button class="icon-btn" data-settings="profile" aria-label="Settings">${ic("settings")}</button></div>
      <div class="content"><div class="col ${r.wide ? "wide" : ""}">${inner}</div></div>
      ${S.route === "assistant" ? "" : `<div class="chatbar"><div class="inner" data-act="chat">${`<span class="orb"></span>`}<input placeholder="Ask Kato, or tell it what to do" aria-label="Ask Kato" readonly><button class="btn primary sm" aria-label="Open Kato">${ic("up", "sm")}</button></div></div>`}
    </div>
  </div>`;
}

function chatHtml() {

function render() {
  const { route, params } = routeOf(location.hash);
  S.route = route; S.params = params;
  const app = $("#app");
  if (route === "login") { app.innerHTML = R.login.render(); return; }
  const r = R[route] || { title: "Not found", render: () => card("This screen is not in the prototype", "<p class='muted'>Pick a screen from the list above.</p>") };
  let body;
  if (S.state !== "normal" && !r.nostate) body = stateBox(S.state, r.title);
  else body = r.render(params);
  const srcLabel = { iip: "Exists in IIP today", cip: "Taken from CIP", new: "Proposed, not built" }[r.src] || "";
  const head = `<div class="head"><div><div class="eyebrow">${r.group || ""}</div><h1>${r.title}${r.src ? tag(r.src) : ""}</h1>${r.sub ? `<p>${r.sub}</p>` : ""}</div>${r.acts ? `<div class="acts">${r.acts}</div>` : ""}</div>${r.note ? `<div class="annot">${srcLabel}. ${r.note.replace(/^Not built\.\s*/, "")}</div>` : ""}`;
  app.innerHTML = shell(head + body, r) + (S.menu ? menuHtml() : "") + (S.settings ? settingsHtml() : "") + (S.chat ? chatHtml() : "");
  const sel = $("#screenpick"); if (sel) sel.value = route;
}

/* ---------- events (one delegated listener) ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-act],[data-tab],[data-toggle],[data-settings],[data-stop],[data-inbox]");
  if (S.menu && !e.target.closest(".menu") && !(t && t.dataset.act === "menu")) { S.menu = false; if (!t) return render(); }
  if (!t) return;
  const d = t.dataset;
  if (d.stop && !d.act && !d.go && !d.tab && !d.settings && !d.toggle) return;
  if (d.settings) { S.settings = d.settings; S.menu = false; return render(); }
  if (d.go) { S.menu = false; S.settings = null; S.chat = false; if (location.hash === "#/" + d.go) return render(); return go(...d.go.split("/")); }
  if (d.tab) { const [g, v] = d.tab.split(":"); S.tabs[g] = v; return render(); }
  if (d.toggle) { S.flags[d.toggle] = !(S.flags[d.toggle] ?? d.on === "1"); return render(); }
  if (d.inbox) { S.inboxSel = +d.inbox; return render(); }
  switch (d.act) {
    case "rail": S.rail = !S.rail; return render();
    case "menu": S.menu = !S.menu; return render();
    case "chat": S.chat = !S.chat; return render();
    case "closeset": if (e.target.closest(".modal") && !e.target.closest("[data-act=closeset]")) return; S.settings = null; return render();
    case "reload": return render();
    case "notify": alert("Prototype: the notification bell opens the in-app alerts list."); return;
    case "confirmprop": { const log = $("#chatlog"); log.insertAdjacentHTML("beforeend", `<div class="msg in">Queued 4 reminders for office hours tomorrow. You can cancel any of them from Communications. Nothing has been sent yet.<div class="meta">Kato, now. Recorded in the audit log.</div></div>`); log.scrollTop = log.scrollHeight; return; }
    case "send": { const i = $("#chatin"); if (!i.value.trim()) return; const log = $("#chatlog"); log.insertAdjacentHTML("beforeend", `<div class="msg me">${i.value.replace(/</g, "&lt;")}<div class="meta">You, now</div></div><div class="msg in">In the real product Kato would work out the intent, show a plan, and wait for your confirmation. This is a prototype, so there is no reply.<div class="meta">Kato</div></div>`); i.value = ""; log.scrollTop = log.scrollHeight; return; }
    default: if (d.act && window.ACT && ACT[d.act]) return ACT[d.act](t);
  }
});
window.addEventListener("hashchange", () => { S.menu = false; render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { S.menu = false; S.settings = null; S.chat = false; render(); } });

/* ---------- prototype bar ---------- */
function protoBar() {
  const groups = {};
  Object.entries(R).forEach(([k, r]) => { (groups[r.group || "Other"] = groups[r.group || "Other"] || []).push([k, r.title]); });
  return `<div id="protobar"><b>IIP prototype</b><span>Sample content only. Nothing is connected.</span>

  <label>State <select id="statepick" aria-label="Show state"><option value="normal">Normal</option><option value="loading">Loading</option><option value="empty">Empty</option><option value="filter">Empty after filter</option><option value="error">Error</option><option value="notconfigured">Not configured</option><option value="nopermission">No permission</option></select></label>
  <label><input type="checkbox" id="annpick" checked> Labels</label><label><input type="checkbox" id="proppick" checked> Proposed additions</label>
  <span class="grow"></span><span class="legend"><span>${tag("iip")}</span><span>${tag("cip")}</span><span>${tag("new")}</span></span></div>`;
}
function boot() {
  document.body.insertAdjacentHTML("afterbegin", protoBar());
  $("#screenpick").addEventListener("change", (e) => go(e.target.value));
  $("#statepick").addEventListener("change", (e) => { S.state = e.target.value; render(); });
  $("#annpick").addEventListener("change", (e) => document.body.classList.toggle("noann", !e.target.checked));
  $("#proppick").addEventListener("change", (e) => document.body.classList.toggle("noprop", !e.target.checked));
  render();
}

    : t.cur === "plans" ? card("", table(["Plan", "UGX / month", "USD / month", "Claims", "Seats", "Self-serve"], PLANS.map(p => ({ cells: [`<b>${p[0]}</b>`, `<input class="in" value="${p[2]}" style="width:120px">`, `<input class="in" value="${p[3]}" style="width:80px">`, p[4].split(",")[0], p[4].split(",")[1] || "Custom", toggle("ss" + p[0], p[0] !== "Enterprise")] }))), { flush: true, cls: "flush" }) + `<div class="mt">${btn("Save catalogue", { kind: "primary" })}</div>`
    : card("Tax and invoices", `<div class="row">${field("VAT rate", "18%")}${field("Our TIN", "")}</div><div class="row">${field("Invoice number format", "INV-{year}-{sequence}")}${field("Payment terms", "14 days", { type: "select", options: ["Due on receipt", "7 days", "14 days", "30 days"] })}</div>${field("Bank transfer details", "Bank, account name, account number, branch", { type: "area" })}${field("Invoice footer", "Thank you for choosing IIP.", { type: "area" })}${btn("Save", { kind: "primary" })}`)); }
};

/* sub-navigation shared by every operator screen */
const OPNAV = [["operator", "Accounts"], ["operatorinvoices", "Invoices"], ["operatoronboard", "Onboard a customer"], ["operatorbilling", "Billing setup"]];
Object.keys(R).filter(k => k.startsWith("operator")).forEach(k => {
  const inner = R[k].render;
  const parent = { operatoraccount: "operator", operatorinvoice: "operatorinvoices" }[k] || k;
  R[k].render = (p) => `<div class="tabs" role="navigation" aria-label="Operator console">${OPNAV.map(([r, l]) => `<button class="${r === parent ? "on" : ""}" data-go="${r}">${l}</button>`).join("")}</div>` + inner(p);
});

boot();
