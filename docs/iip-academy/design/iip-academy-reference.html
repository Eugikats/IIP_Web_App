<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IIP Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#EEF3FB;--card:#fff;--navy:#0E1E8C;--blue:#0B4FE0;--blue-d:#0942BE;--blue-2:#E7EEFE;--orange:#F5A524;--orange-2:#FFF4E0;--text:#1B2340;--muted:#5B6585;--line:#E4E9F4;--green:#12A150;--red:#E5484D;--shadow:0 1px 2px rgba(16,30,84,.04),0 10px 28px rgba(16,30,84,.06)}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
[data-go],[data-act]{cursor:pointer}
.ic{flex:none;display:block}
h1,h2,h3{letter-spacing:-.4px}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:auto;display:flex;align-items:center;gap:20px;padding:12px 24px}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.6px;display:block;line-height:1.05}
.logo small{font-size:11.5px;color:var(--muted);font-weight:500}
.tnav{display:flex;gap:4px;margin-left:auto}
.tnav a{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14.5px;color:#2a3352;transition:.15s}
.tnav a:hover{background:#F2F6FD}
.tnav a.on{background:var(--blue-2);color:var(--navy)}
.tright{display:flex;align-items:center;gap:14px;margin-left:10px}
.bell{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#2a3352}
.bell:hover{background:#F2F6FD}
.bell .dot{position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.user{position:relative;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;padding:4px 6px 4px 4px;border-radius:30px}
.user:hover{background:#F2F6FD}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 10px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(16,30,84,.14);padding:6px;min-width:220px;display:none;z-index:50}
.user.open .menu{display:block}
.menu a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;font-weight:500;font-size:14px}
.menu a:hover{background:#F2F6FD}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px}

main{max-width:1200px;margin:auto;padding:24px 24px 60px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.pagehead{margin:6px 0 22px}
.pagehead h1{font-size:32px;font-weight:800;color:var(--navy)}
.pagehead p{color:var(--muted);margin-top:6px}
.crumbs{font-size:13.5px;color:var(--muted);margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--blue);font-weight:600}
.link{color:var(--blue);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 20px;border-radius:12px;font-weight:700;font-size:14.5px;transition:.15s;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(11,79,224,.22)}
.btn.primary:hover{background:var(--blue-d)}
.btn.soft{background:var(--blue-2);color:var(--navy)}
.btn.soft:hover{background:#DCE6FD}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.ghost:hover{border-color:#C9D5EE}
.btn.orange{background:var(--orange);color:#fff}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* hero */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;min-height:196px;background:linear-gradient(100deg,#E9F0FE 0%,#F2F5FD 48%,#FFF4E2 100%)}
.hero-txt{padding:40px;position:relative;z-index:2;max-width:640px}
.hero h1{font-size:46px;font-weight:800;color:var(--navy);letter-spacing:-1.2px;line-height:1.1}
.hero p{color:var(--muted);font-size:17px;margin-top:12px}
.wave{display:inline-block;animation:wave 2.4s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}}
.hero-art{position:absolute;right:0;bottom:0;top:0;width:560px}
.hero-art svg{width:100%;height:100%}
.quote{position:absolute;right:26px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.88);border-radius:16px;padding:22px 24px;font-weight:600;color:var(--navy);font-size:16.5px;line-height:1.5;z-index:3;box-shadow:0 8px 24px rgba(16,30,84,.06)}
.quote i{display:block;width:32px;height:4px;border-radius:4px;background:var(--orange);margin-top:12px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1.05fr 1.2fr;gap:18px;margin-top:18px}
.stat{display:flex;align-items:center;gap:22px;padding:22px 24px;transition:.15s}
.stat:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(16,30,84,.1)}
.stat .ico{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;flex:none}
.ico.blue{background:var(--blue-2);color:var(--blue)}
.ico.amber{background:var(--orange-2);color:var(--orange)}
.stat b{font-size:32px;font-weight:800;color:var(--navy);display:block;line-height:1.1}
.stat span{color:var(--muted)}
.stat .short{display:none}

.sechead{display:flex;align-items:center;justify-content:space-between;margin:30px 2px 14px}
.sechead h2{font-size:26px;font-weight:800;color:var(--navy)}

/* course cards */
.crow-wrap{position:relative}
.crow{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/3);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 16px;scroll-behavior:smooth}
.crow::-webkit-scrollbar{display:none}
.crow>*{scroll-snap-align:start}
.carr{position:absolute;right:-20px;top:42%;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(16,30,84,.15);display:grid;place-items:center;color:var(--navy);z-index:3}
.ccard{overflow:hidden;display:flex;flex-direction:column;transition:.18s}
.ccard:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(16,30,84,.12)}
.thumb{position:relative;height:150px;overflow:hidden;display:grid;place-items:center;margin:8px 8px 0;border-radius:14px}
.thumb .tdeco{position:absolute;inset:0;width:100%;height:100%}
.ticon{position:relative;width:74px;height:74px;border-radius:22px;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.35)}
.badge{position:absolute;top:12px;right:12px;background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;color:#1f2a4d}
.badge.green{color:var(--green)}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.cat{font-size:12.5px;letter-spacing:.4px;text-transform:uppercase;color:#3a4566;font-weight:500}
.cbody h3{font-size:18.5px;font-weight:800;color:var(--navy);margin:6px 0 14px;line-height:1.3;min-height:48px}
.pc{color:var(--muted);font-size:14.5px}
.bar{height:6px;border-radius:6px;background:#E8EDF7;margin:8px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px;transition:width .5s}
.bar.ghost{background:transparent}
.meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin-bottom:18px;margin-top:auto}
.meta span{display:flex;align-items:center;gap:7px}
.meta .sep{width:1px;height:14px;background:var(--line)}

/* row2 */
.row2{display:grid;grid-template-columns:1fr 290px;gap:18px;margin-top:10px;align-items:stretch}
.comm{display:flex;align-items:center;gap:20px;padding:22px 26px;background:linear-gradient(100deg,#FFF6E8,#FDF1F6 60%,#F4F1FD)}
.comm .ci{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--navy);flex:none}
.comm h3{font-size:18px;color:var(--navy);font-weight:800}
.comm p{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.5}
.comm .btn{margin-left:auto;border-radius:30px}
.aimini{padding:16px}
.aih{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:15px}
.aih .ic{color:var(--orange)}
.aih button{margin-left:auto;color:var(--muted);width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.aih button:hover{background:#F2F6FD}
.minif{display:flex;align-items:center;background:#F4F6FB;border-radius:30px;padding:5px 5px 5px 16px;margin-top:14px}
.minif input{flex:1;border:0;background:transparent;outline:0;font-size:13.5px;min-width:0}
.send{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#F7B733,#F08A24);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.5}
.aimini.collapsed .minif{display:none}

/* course grid page */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px;height:44px;flex:1;min-width:220px;max-width:380px;color:var(--muted)}
.search input{border:0;outline:0;flex:1;background:transparent;color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 15px;border-radius:30px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13.5px;color:#36405f;transition:.15s}
.chip:hover{border-color:#C6D3EE}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.empty{text-align:center;color:var(--muted);padding:60px 20px}

/* course page */
.chero{display:grid;grid-template-columns:360px 1fr;gap:26px;padding:20px}
.chero .thumb{height:100%;min-height:220px;margin:0}
.chero h1{font-size:30px;color:var(--navy);font-weight:800;line-height:1.2;margin:8px 0 10px}
.chero p.d{color:var(--muted);line-height:1.6}
.cmeta{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0;color:var(--muted);font-size:14px}
.cmeta span{display:flex;align-items:center;gap:7px}
.cgrid2{display:grid;grid-template-columns:1fr 340px;gap:18px;margin-top:18px;align-items:start}
.panel{padding:22px 24px}
.panel h2{font-size:19px;color:var(--navy);font-weight:800;margin-bottom:14px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.outs div{display:flex;gap:10px;font-size:14.5px;line-height:1.5}
.outs .ic{color:var(--green);margin-top:2px}
.mod{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.modh{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left}
.modh:hover{background:#F8FAFE}
.modn{width:34px;height:34px;border-radius:10px;background:var(--blue-2);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.modn.done{background:#E3F6EA;color:var(--green)}
.modh b{display:block;font-size:15px;color:var(--navy)}
.modh small{color:var(--muted);font-size:12.5px}
.modh .chev{margin-left:auto;transition:.2s;color:var(--muted)}
.mod.open .chev{transform:rotate(180deg)}
.lsn{display:none;border-top:1px solid var(--line)}
.mod.open .lsn{display:block}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 16px 12px 64px;font-size:14px}
.lrow:hover{background:#F6F9FE}
.lrow .st{width:22px;height:22px;border-radius:50%;border:2px solid #CBD5EA;display:grid;place-items:center;flex:none}
.lrow .st.done{background:var(--green);border-color:var(--green);color:#fff}
.lrow .st.cur{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-2)}
.lrow .dur{margin-left:auto;color:var(--muted);font-size:12.5px}
.inst{display:flex;gap:14px;align-items:center}
.inst b{color:var(--navy)}
.inst small{color:var(--muted);display:block;font-size:13px;margin-top:2px}
.bigpct{font-size:36px;font-weight:800;color:var(--navy)}

/* learn */
.learn{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.player{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
.player .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,60,.15),rgba(8,16,60,.75))}
.player .ptitle{position:absolute;left:24px;top:22px;right:24px;font-weight:700;font-size:15px;opacity:.95;display:flex;gap:10px;align-items:center}
.pbtn{position:relative;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--blue);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.2s}
.player:hover .pbtn{transform:scale(1.06)}
.pctrl{position:absolute;left:20px;right:20px;bottom:16px;display:flex;align-items:center;gap:14px;font-size:13px;font-weight:600}
.ptrack{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.3);overflow:hidden}
.ptrack i{display:block;height:100%;width:0;background:var(--orange)}
.eq{display:none;gap:3px;align-items:flex-end;height:16px}
.playing .eq{display:flex}
.eq i{width:3px;background:#fff;border-radius:2px;animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.lcontent{padding:26px 28px;margin-top:18px}
.lmeta{color:var(--blue);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.lcontent h1{font-size:28px;color:var(--navy);font-weight:800;margin:8px 0 14px;line-height:1.25}
.lcontent p{line-height:1.7;color:#37415f}
.lcontent h3{color:var(--navy);margin:22px 0 10px;font-size:17px}
.lcontent ul{padding-left:0;list-style:none;display:grid;gap:10px}
.lcontent li{display:flex;gap:10px;line-height:1.55}
.lcontent li .ic{color:var(--orange);margin-top:3px}
.tryit{background:#F5F8FF;border:1px dashed #BFD0F6;border-radius:16px;padding:18px;margin-top:22px}
.tryit b{color:var(--navy);display:flex;gap:8px;align-items:center}
.tryit p{margin:6px 0 12px;font-size:14.5px}
.tryit textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;outline:0;background:#fff}
.tryit textarea:focus{border-color:var(--blue)}
.lnav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.lside{padding:20px;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}
.lside h3{font-size:15px;color:var(--navy);margin-bottom:4px}
.lside .mt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 6px}
.lside .lrow{padding:9px 8px;border-radius:10px}
.lside .lrow.on{background:var(--blue-2);font-weight:700;color:var(--navy)}

/* community */
.cgrid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.composer{padding:18px;display:flex;gap:14px}
.composer textarea{width:100%;border:0;outline:0;resize:none;min-height:64px;font-size:15px;background:transparent}
.composer .cf{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.composer select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:13.5px}
.post{padding:20px 22px;margin-top:16px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{display:flex;gap:12px;align-items:center}
.ph b{color:var(--navy);font-size:15px}
.ph small{display:block;color:var(--muted);font-size:12.5px}
.tag{margin-left:auto;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--blue-2);color:var(--navy)}
.tag.Fraud{background:#FDECEC;color:#B4232A}.tag.Question{background:var(--orange-2);color:#A15C00}.tag.Sales{background:#E8F7EE;color:#0F7A3E}
.post p.tx{margin:14px 0;line-height:1.65;color:#37415f}
.pa{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pa button{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.pa button:hover{background:#F4F7FD}
.pa button.liked{color:var(--red)}
.pa button.liked svg{fill:var(--red)}
.cmts{margin-top:10px;display:grid;gap:10px}
.cmt{display:flex;gap:10px}
.cmt div{background:#F5F7FC;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;flex:1}
.cmt div b{display:block;color:var(--navy);font-size:13px}
.cform{display:flex;gap:8px;margin-top:4px}
.cform input{flex:1;border:1px solid var(--line);border-radius:30px;padding:10px 16px;outline:0}
.side{padding:20px;margin-bottom:16px}
.side h3{font-size:16px;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.srow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow b{font-size:14px;color:var(--navy);display:block}
.srow small{color:var(--muted);font-size:12.5px}
.srow .btn{margin-left:auto}
.gi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.tabs{display:flex;gap:6px;margin-top:18px}

/* notifications */
.nrow{display:flex;gap:14px;align-items:center;padding:16px 20px;border-top:1px solid var(--line);transition:.15s}
.nrow:first-child{border-top:0}
.nrow:hover{background:#F8FAFE}
.nrow .ni{width:44px;height:44px;border-radius:50%;background:var(--blue-2);color:var(--blue);display:grid;place-items:center;flex:none}
.nrow b{font-weight:600;font-size:14.5px;display:block}
.nrow.read b{font-weight:500;color:#4a5373}
.nrow small{color:var(--muted);font-size:12.5px}
.nrow .ud{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-left:auto;flex:none}

/* profile, progress, settings, certs */
.pcover{height:130px;border-radius:20px 20px 0 0;background:linear-gradient(110deg,#0E1E8C,#2F6BF2 60%,#F5A524)}
.pmain{padding:0 28px 26px;display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;margin-top:-46px}
.pmain .av{border:5px solid #fff}
.pmain h1{font-size:26px;color:var(--navy)}
.pmain p{color:var(--muted);margin-top:4px}
.pmain .btn{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
.kpi{padding:18px 20px}
.kpi b{font-size:28px;color:var(--navy);font-weight:800;display:block}
.kpi span{color:var(--muted);font-size:13.5px}
.skills{display:flex;flex-wrap:wrap;gap:8px}
.skills span{padding:8px 13px;border-radius:30px;background:var(--blue-2);color:var(--navy);font-size:13px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bars i{width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#4F86F7,var(--blue));min-height:4px;transition:height .6s}
.bars i.today{background:linear-gradient(180deg,#F8C25C,var(--orange))}
.bars small{color:var(--muted);font-size:12px;font-weight:600}
.prow{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .mini{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.prow .grow{flex:1;min-width:0}
.prow b{color:var(--navy);font-size:15px}
.prow .bar{margin:8px 0 0}
.setrow{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow b{display:block;font-size:15px;color:var(--navy)}
.setrow small{color:var(--muted);font-size:13px}
.setrow>div{flex:1}
.setrow select,.setrow input[type=text],.setrow input[type=email]{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;min-width:200px}
.tog{position:relative;width:46px;height:26px;flex:none}
.tog input{opacity:0;width:0;height:0}
.tog i{position:absolute;inset:0;background:#CFD7E8;border-radius:30px;transition:.2s;cursor:pointer}
.tog i:after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog input:checked+i{background:var(--blue)}
.tog input:checked+i:after{transform:translateX(20px)}
.certcard{padding:20px;display:flex;flex-direction:column;gap:12px}
.certcard .cico{width:56px;height:56px;border-radius:16px;background:var(--orange-2);color:var(--orange);display:grid;place-items:center}
.certcard.locked .cico{background:#EEF1F7;color:#9AA4BE}
.certcard h3{color:var(--navy);font-size:17px;line-height:1.35}
.certcard small{color:var(--muted)}
.certificate{max-width:860px;margin:0 auto;background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.certificate .inner{border:2px solid #E7D6B0;border-radius:14px;padding:50px 50px 40px;text-align:center;background:radial-gradient(circle at top,#FFFBF2,#fff 60%);position:relative}
.certificate .inner:before{content:'';position:absolute;inset:8px;border:1px solid #F0E4C8;border-radius:10px;pointer-events:none}
.certificate .ct{letter-spacing:4px;text-transform:uppercase;color:#A1772A;font-weight:700;font-size:13px;margin-top:20px}
.certificate h2{font-size:38px;color:var(--navy);margin:12px 0 8px;font-weight:800}
.certificate .nm{font-size:34px;color:var(--navy);font-weight:800;border-bottom:2px solid #E7D6B0;display:inline-block;padding:0 30px 6px;margin:14px 0}
.certificate .cname{font-size:20px;font-weight:700;color:var(--blue);margin-top:6px}
.sigs{display:flex;justify-content:space-around;margin-top:46px;gap:20px}
.sigs div{border-top:1px solid #C9CFDF;padding-top:8px;min-width:180px;font-size:13px;color:var(--muted)}
.sigs b{display:block;color:var(--navy);font-size:14px}
.seal{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#F8C25C,#E59410);color:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 6px 18px rgba(229,148,16,.35)}

/* sign in */
.signwrap{min-height:calc(100vh - 48px);display:grid;place-items:center}
.signcard{width:100%;max-width:420px;padding:36px}
.signcard h1{font-size:26px;color:var(--navy);margin:24px 0 6px}
.signcard p{color:var(--muted);margin-bottom:22px}
.field{display:block;margin-bottom:14px;font-size:13.5px;font-weight:600;color:#36405f}
.field input{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0;font-weight:500}
.field input:focus{border-color:var(--blue)}
body.signin .top,body.signin .bnav,body.signin .fab,body.signin .aiw{display:none!important}

/* chat */
.chatlog{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;animation:pop .3s ease}
.msg.u{justify-content:flex-end}
.msg.u .bub{background:var(--blue);color:#fff;border-radius:18px 18px 4px 18px;max-width:82%}
.aav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F7B733,#F08A24);color:#fff;display:grid;place-items:center;flex:none}
.abody{flex:1;min-width:0;max-width:92%}
.msg.a .bub{background:#F4F6FB;border-radius:4px 18px 18px 18px}
.bub{padding:12px 15px;font-size:14.5px;line-height:1.6;word-wrap:break-word}
.bub p+p,.bub ul+p,.bub p+ul{margin-top:8px}
.bub ul{padding-left:18px;margin-top:6px}
.bub li{margin:3px 0}
.bub b{color:inherit;font-weight:700}
.msg.a .bub b{color:var(--navy)}
.caret{display:inline-block;width:7px;height:15px;background:var(--orange);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite;border-radius:1px}
@keyframes blink{50%{opacity:0}}
.steps{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fff;font-size:13px}
.steps .sum{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;width:100%;text-align:left}
.steps .sum .ic{color:var(--green)}
.steps .sum .chv{margin-left:auto;transition:.2s}
.steps.open .sum .chv{transform:rotate(180deg)}
.step{display:flex;gap:9px;align-items:center;padding:4px 0;color:var(--muted)}
.step.run{color:var(--navy);font-weight:600}
.step.done{color:#4a5373}
.step .si{width:18px;height:18px;display:grid;place-items:center;flex:none}
.step.done .si{color:var(--green)}
.step.pending .si i{width:7px;height:7px;border-radius:50%;background:#D3DAEA}
.spin{width:14px;height:14px;border:2px solid var(--blue-2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steps.collapsed .slist{display:none}
.steps .slist{margin-top:6px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--navy)}
.src:hover{border-color:var(--blue)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quiz{margin-top:10px;display:grid;gap:8px}
.qopt{text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;line-height:1.4;transition:.15s}
.qopt:hover{border-color:var(--blue)}
.qopt.right{border-color:var(--green);background:#E8F7EE;color:#0F6B37;font-weight:600}
.qopt.wrong{border-color:var(--red);background:#FDECEC;color:#A11E24}
.qfb{font-size:14px;line-height:1.55;padding:10px 12px;border-radius:12px;background:#F5F8FF}
.welcome{text-align:center;margin:auto;padding:20px;max-width:420px}
.welcome .aav{width:56px;height:56px;margin:0 auto 14px}
.welcome h3{color:var(--navy);font-size:20px}
.welcome p{color:var(--muted);font-size:14px;margin:6px 0 18px}
.welcome .chips{justify-content:center}
.welcome .chip{font-size:13px;text-align:left}
.chatform{display:flex;align-items:center;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chatform input{flex:1;border:1px solid var(--line);background:#F6F8FC;border-radius:30px;padding:12px 18px;outline:0;min-width:0}
.chatform input:focus{border-color:var(--blue);background:#fff}
.aipage{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
.aichat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:520px;overflow:hidden}
.aihead{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}
.aihead h2{font-size:18px;color:var(--navy)}
.aihead p{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.aihead .btn{margin-left:auto}
.live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #D7F3E2;display:inline-block}
.capr{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;width:100%;text-align:left;font-size:14px}
.capr:hover{background:#F4F7FD}
.capr .ci{width:34px;height:34px;border-radius:10px;background:var(--orange-2);color:#C77700;display:grid;place-items:center;flex:none}
.capr b{display:block;color:var(--navy);font-size:14px}
.capr small{color:var(--muted);font-size:12.5px}
.actlog{display:grid;gap:2px;max-height:300px;overflow:auto;font-size:13px}
.alr{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line);animation:pop .3s}
.alr:first-child{border-top:0}
.alr time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;font-size:12px;padding-top:1px}
.alr .ic{color:var(--green);margin-top:2px}

/* floating widget */
.fab{position:fixed;right:24px;bottom:24px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#F7B733,#F08A24);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(240,138,36,.45),0 0 0 6px rgba(255,255,255,.7);z-index:45;transition:.2s}
.fab:hover{transform:scale(1.06)}
body[data-route=dashboard] .fab,body[data-route=assistant] .fab,body.aiw-open .fab{display:none}
.aiw{position:fixed;right:24px;bottom:24px;width:390px;height:min(620px,calc(100vh - 110px));background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(16,30,84,.25);z-index:60;display:none;flex-direction:column;overflow:hidden;animation:pop .25s ease}
body.aiw-open .aiw{display:flex}
body[data-route=assistant] .aiw{display:none!important}
.aiwh{display:flex;align-items:center;gap:10px;padding:14px 14px 14px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--navy)}
.aiwh .aav{width:30px;height:30px}
.aiwh small{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--muted);font-size:12px}
.aiwh .hb{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.aiwh .hb:hover{background:#F2F6FD}
.aiwh .hb:first-of-type{margin-left:auto}

/* bottom nav */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:44;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#6B7494;padding:4px 0}
.bnav a.on{color:var(--blue)}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;display:flex;gap:10px;align-items:center;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(10,18,60,.45);backdrop-filter:blur(3px);display:none;place-items:center;z-index:90;padding:20px}
.modal.show{display:grid}
.mbox{background:#fff;border-radius:22px;padding:32px;max-width:440px;width:100%;text-align:center;animation:pop .3s}
.mbox h2{color:var(--navy);margin:16px 0 8px}
.mbox p{color:var(--muted);line-height:1.6}
.mbox .btns{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}

@media (max-width:1060px){
  .grid3{grid-template-columns:1fr 1fr}
  .cgrid,.cgrid2,.learn,.aipage{grid-template-columns:1fr}
  .lside{position:static;max-height:none}
  .hero-art{width:440px;opacity:.9}
  .quote{display:none}
  .kpis{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .tnav,.user .uname,.user .chv{display:none}
  .top-in{padding:12px 16px}
  .logo b{font-size:22px}
  .tright{margin-left:auto}
  .bnav{display:flex}
  main{padding:16px 16px 100px}
  .hero{min-height:150px}
  .hero-txt{padding:22px 18px;max-width:62%}
  .hero h1{font-size:25px;letter-spacing:-.6px}
  .hero p{font-size:12.5px;margin-top:8px}
  .hero-art{width:62%;opacity:1}
  .stats{grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .stat{flex-direction:column;gap:6px;padding:14px 8px;text-align:center}
  .stat .ico{width:44px;height:44px}
  .stat .ico svg{width:22px;height:22px}
  .stat b{font-size:19px}
  .stat span{font-size:12px}
  .stat .full{display:none}.stat .short{display:inline}
  .sechead{margin:22px 2px 10px}
  .sechead h2{font-size:20px}
  .crow{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:1fr;overflow:visible}
  .carr{display:none}
  .row2{grid-template-columns:1fr}
  .aimini{display:none}
  .comm{flex-wrap:wrap;padding:18px}
  .comm .btn{margin-left:0}
  .grid3,.outs{grid-template-columns:1fr}
  .chero{grid-template-columns:1fr;padding:14px}
  .chero .thumb{min-height:170px}
  .chero h1{font-size:23px}
  .pagehead h1{font-size:26px}
  .fab{bottom:90px;right:16px;width:56px;height:56px}
  .aiw{inset:0;width:auto;height:auto;border-radius:0}
  .aichat{height:calc(100vh - 140px)}
  .lcontent{padding:20px}
  .lcontent h1{font-size:22px}
  .certificate .inner{padding:30px 18px}
  .certificate h2{font-size:26px}.certificate .nm{font-size:24px}
  .sigs{flex-direction:column;align-items:center}
  .setrow{flex-wrap:wrap}
  .setrow select,.setrow input[type=text],.setrow input[type=email]{min-width:0;width:100%}
}
@media print{
  body{background:#fff}
  .top,.bnav,.fab,.aiw,.toast,.crumbs,.noprint{display:none!important}
  main{padding:0}
  .certificate{box-shadow:none}
}
/* ===== v2 ===== */
.logo img{height:46px;width:auto;display:block}
.av{object-fit:cover}
/* hero with real photo */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 320px 230px;align-items:center;min-height:240px}
.hero-txt{padding:40px 10px 40px 40px;max-width:none}
.hero-fig{position:relative;align-self:stretch;min-height:240px}
.hero-fig .arc{position:absolute;left:-10px;bottom:-230px;width:430px;height:430px;border-radius:50%;background:linear-gradient(135deg,#F9C35C,#F08A24)}
.hero-fig .beam{position:absolute;left:190px;top:-30px;width:64px;height:340px;background:#FFD27A;opacity:.55;transform:skewX(-22deg)}
.hero-fig img{position:absolute;left:50%;top:18px;width:250px;transform:translateX(-50%);filter:drop-shadow(0 12px 22px rgba(14,30,140,.14))}
.quote{position:relative;right:auto;top:auto;transform:none;margin-right:24px}
/* community banner on dashboard */
.comm .ctx{flex:1;min-width:0}
.commbtns{display:flex;flex-direction:column;gap:8px;flex:none}
.comm .commbtns .btn{margin-left:0;border-radius:30px}
.btn.discord{background:#5865F2;color:#fff}
.btn.discord:hover{background:#4752C4}
.btn.white{background:#fff;color:#4752C4}
/* course sales page */
.shero{padding:28px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:26px;align-items:center}
.shero .thumb{margin:0;height:100%;min-height:190px}
.shero h1{font-size:32px;color:var(--navy);font-weight:800;line-height:1.2;margin:8px 0 10px}
.shero p.d{color:var(--muted);line-height:1.65}
.sale{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;margin-top:18px;align-items:start}
.salemain .panel{margin-bottom:18px}
.pricecard{padding:24px;position:sticky;top:90px}
.tagline{font-size:12.5px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.price{font-size:34px;font-weight:800;color:var(--navy);letter-spacing:-.8px}
.pnote{color:var(--muted);font-size:14px;margin:6px 0 16px;line-height:1.55}
.pnote b{color:var(--navy)}
.incl{display:grid;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.incl div{display:flex;gap:11px;align-items:center;font-size:14.5px}
.incl .ic{color:var(--blue)}
.who{display:grid;gap:12px}
.who div{display:flex;gap:11px;font-size:14.5px;line-height:1.5}
.who .ic{color:var(--blue);margin-top:1px}
.outs .ic{margin-top:1px}
.cmod{padding:16px 0;border-top:1px solid var(--line)}
.cmod:first-of-type{border-top:0;padding-top:4px}
.cmod h4{display:flex;align-items:center;gap:12px;color:var(--navy);font-size:16px;font-weight:800;line-height:1.3}
.cmod ol{list-style:none;margin:10px 0 0 46px;display:grid;gap:9px}
.cmod li{display:flex;gap:10px;align-items:center;font-size:14.5px;color:#37415f;line-height:1.4}
.cmod li i{width:6px;height:6px;border-radius:50%;background:#B9C6E4;flex:none;margin:0 5px}
.cmod li.done{color:var(--muted)}
.cmod li .ic{color:var(--green)}
.cmod li[data-go]{cursor:pointer}
.cmod li[data-go]:hover{color:var(--blue)}
.mbar{display:none}
/* checkout + modals */
.modal{overflow:auto}
.mbox{position:relative;max-height:calc(100vh - 40px);overflow:auto}
.mbox.left{text-align:left}
.mbox.left h2{margin-top:0}
.mbox.wide{max-width:620px}
.ckc{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;background:#F5F8FF;margin:14px 0 18px}
.ckc b{color:var(--navy);display:block;line-height:1.35;font-size:15px}
.ckc small{color:var(--muted);font-size:13px}
.ckc .mini{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.payopts{display:grid;gap:10px;margin-bottom:16px}
.payopt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;text-align:left;width:100%;transition:.15s}
.payopt:hover{border-color:#C6D3EE}
.payopt.on{border-color:var(--blue);background:#F5F8FF}
.payopt b{display:block;font-size:14.5px;color:var(--navy)}
.payopt small{color:var(--muted);font-size:12.5px}
.payopt .pl{width:44px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.payopt .rd{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid #C9D3EA;flex:none;transition:.15s}
.payopt.on .rd{border:6px solid var(--blue)}
.cktotal{display:flex;justify-content:space-between;align-items:center;padding:14px 0;margin-top:4px;border-top:1px solid var(--line);font-weight:600}
.cktotal b{font-size:20px;color:var(--navy)}
.cknote{font-size:12.5px;text-align:center;margin-top:12px}
.bigspin{width:48px;height:48px;border:4px solid var(--blue-2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:6px auto 0}
.seal.ok{background:radial-gradient(circle,#4ADE80,#12A150);box-shadow:0 6px 18px rgba(18,161,80,.3)}
/* learn: wide video */
body[data-route=learn] main{max-width:1440px}
.player{width:100%;max-width:calc((100vh - 150px) * 16 / 9);min-width:min(100%,640px);margin:0 auto}
.player:fullscreen{max-width:none;width:100%;height:100%;border-radius:0;aspect-ratio:auto}
.ptitle span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfs{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.16);flex:none}
.pfs:hover{background:rgba(255,255,255,.28)}
.learn{margin-top:18px}
.lcontent{margin-top:0}
.lcontent li .ic{color:var(--green)}
/* community */
.pagehead.row{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pagehead.row>a{margin-left:auto}
.dc{background:linear-gradient(130deg,#5865F2,#7B84F6);color:#fff}
.dc h3{color:#fff}
.dc p{color:rgba(255,255,255,.9);font-size:14px;line-height:1.55;margin:-2px 0 14px}
.sidep{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:14px}
.newbie{padding:30px 24px;text-align:center;background:linear-gradient(120deg,#EEF3FE,#FFF5E6)}
.newbie .nic{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 14px;color:var(--blue);box-shadow:var(--shadow)}
.newbie h2{color:var(--navy);font-size:21px}
.newbie p{color:var(--muted);margin:6px auto 18px;max-width:440px;line-height:1.55}
.gpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 20px}
.gopt{position:relative;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;transition:.15s}
.gopt:hover{border-color:#C6D3EE}
.gopt.on{border-color:var(--blue);background:#F5F8FF}
.gopt b{color:var(--navy);font-size:14.5px;margin-top:4px}
.gopt small{color:var(--muted);font-size:12.5px;line-height:1.45}
.gopt .gm{font-weight:600;color:#56608A}
.gopt .ck{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;border:2px solid #C9D3EA;display:grid;place-items:center;color:#fff}
.gopt.on .ck{background:var(--blue);border-color:var(--blue)}
.mbox .btns{justify-content:flex-end}
.mbox:not(.left) .btns{justify-content:center}
/* chat: no flicker */
.msg{animation:none}
.msg.enter{animation:pop .3s ease}
.alr{animation:none}
.alr.enter{animation:pop .3s ease}
.chatlog{scroll-behavior:auto;overscroll-behavior:contain}
.sum.working{color:var(--navy)}
.qq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;color:var(--navy);font-size:14.5px;line-height:1.5}
/* responsive */
@media (max-width:1060px){
 .hero{grid-template-columns:minmax(0,1fr) 300px}
 .sale{grid-template-columns:minmax(0,1fr) 320px}
}
@media (max-width:860px){
 .hero{grid-template-columns:minmax(0,1fr) 40%;min-height:180px}
 .hero-txt{padding:22px 4px 22px 18px;max-width:none}
 .hero h1{font-size:25px;line-height:1.12}
 .hero p{font-size:13px;line-height:1.45;margin-top:8px}
 .hero-fig{min-height:180px}
 .hero-fig .arc{width:250px;height:250px;left:-6px;bottom:-140px}
 .hero-fig .beam{left:96px;width:36px;height:260px}
 .hero-fig img{width:150px;top:14px}
 .comm{gap:14px}
 .commbtns{flex-direction:row;width:100%}
 .commbtns .btn{flex:1;padding:0 12px}
 .shero{grid-template-columns:1fr;padding:16px;gap:16px}
 .shero .thumb{order:-1;min-height:150px;height:150px}
 .shero h1{font-size:23px}
 .sale{grid-template-columns:1fr}
 .pricecard{position:static}
 .cmod ol{margin-left:0}
 .panel{padding:18px}
 .mbar{display:flex;position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(16,30,84,.08);padding:10px 16px;align-items:center;gap:12px;z-index:43}
 .mbar small{display:block;color:var(--muted);font-size:12px}
 .mbar b{color:var(--navy);font-size:18px}
 .mbar .btn{margin-left:auto}
 body.hasbar main{padding-bottom:170px}
 body.hasbar .fab{bottom:156px}
 .player{width:calc(100% + 32px);max-width:none;min-width:0;margin:0 -16px;border-radius:0}
 .ptitle{left:14px;right:14px;top:12px;font-size:13px}
 .pbtn{width:64px;height:64px}
 .pctrl{left:14px;right:14px;bottom:10px;gap:10px}
 .pagehead.row>a{margin-left:0}
 .gpick{grid-template-columns:1fr}
 .mbox{padding:24px 20px}
 .tabs{overflow-x:auto}
 .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
 .welcome .chips,.toolbar .chips{flex-wrap:wrap}
 .post{padding:16px}
 .tag{display:none}
 .crumbs{font-size:12.5px}
 .lside{max-height:none}
}
@media (max-width:420px){
 .logo b{font-size:20px}
 .logo small{font-size:10.5px}
 .logo img{height:38px}
 .hero h1{font-size:22px}
 .hero p{font-size:12.5px}
 .hero-fig img{width:136px}
 .stat b{font-size:18px}
 .bnav a{font-size:10.5px}
}


body[data-route=learn] .fab{display:none}
@media (max-width:860px){
 .fab{display:none}
 .aisub{display:none!important}
 .aihead{padding:12px 14px}
 .gpick{gap:8px;margin:12px 0 14px}
 .gopt{display:grid;grid-template-columns:40px 1fr;column-gap:12px;row-gap:2px;padding:12px 44px 12px 12px;align-items:center}
 .gopt .gi{grid-row:span 3}
 .gopt b{margin-top:0}
 .gopt .ck{top:50%;transform:translateY(-50%)}
 .mbox.wide .btns{position:sticky;bottom:-24px;background:#fff;margin:0 -20px -24px;padding:12px 20px 18px;border-top:1px solid var(--line)}
 .mbox.wide .btns .btn{flex:1}
}

const $=s=>document.querySelector(s);

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function isEnrolled(c){return S.enrolled.includes(c.id)}
function doneList(c){return S.done[c.id]||[]}
function pct(c){return Math.round(doneList(c).length/lessons(c).length*100)}
function status(c){if(!isEnrolled(c))return null;const p=pct(c);return p===100?'Completed':p>0?'In progress':'Not started'}
function nextLesson(c){const d=doneList(c);const L=lessons(c);for(let i=0;i<L.length;i++)if(!d.includes(i))return i;return 0}
function activeCourses(){return S.enrolled.map(course).filter(c=>pct(c)<100)}
function myCourses(){const e=S.enrolled.map(course);return [...e.filter(c=>pct(c)<100),...e.filter(c=>pct(c)===100)]}
function overall(){const e=S.enrolled.map(course);let d=0,t=0;e.forEach(c=>{d+=doneList(c).length;t+=lessons(c).length});return Math.min(100,Math.round((d+20)/t*100))}
function totalDone(){return S.enrolled.map(course).reduce((a,c)=>a+doneList(c).length,0)}

/* ---------- router ---------- */
let CUR='#/dashboard';const canHash=/^(https?|file):$/.test(location.protocol)&&location.href.indexOf('srcdoc')<0;

 stopPlayer();$('#userMenu').classList.remove('open');render();if(!same)try{window.scrollTo(0,0)}catch(e){}}
function page(){const [r,a,b]=route();switch(r){
 case 'dashboard':return pDash();case 'courses':return pCourses(a||'all');case 'course':return pCourse(a);case 'learn':return pLearn(a,+b||0);
 case 'community':return pCommunity();case 'assistant':return pAssistant();case 'notifications':return pNotifs();case 'profile':return pProfile();
 case 'progress':return pProgress();case 'settings':return pSettings();case 'certificates':return pCerts();case 'certificate':return pCert(a);case 'signin':return pSignin();
 default:return pNotFound()}}
function render(){const [r]=route();document.body.dataset.route=r;document.body.classList.toggle('signin',r==='signin');if(r==='assistant')document.body.classList.remove('aiw-open');
 $('#view').innerHTML=page();chrome(r);document.body.classList.toggle('hasbar',!!$('.mbar'));syncChats()}
window.addEventListener('popstate',()=>{if(!canHash)return;try{CUR=location.hash.startsWith('#/')?location.hash:'#/dashboard'}catch(e){}stopPlayer();render()});

/* ---------- AI agent ---------- */
const CHAT={msgs:[],busy:false,log:[{t:nowT(),x:'Session started, loaded learner profile'},{t:nowT(),x:'Indexed 4 enrolled courses and personal notes'}]};
const CHIPS=['What should I study next?','Quiz me on service recovery','How do I handle an angry claimant?','Plan my study week','What fraud red flags should I watch for?'];
function fmt(t){const lines=esc(t).split('\n');let h='',ul=false;for(const ln of lines){if(ln.startsWith('- ')){if(!ul){h+='<ul>';ul=true}h+='<li>'+ln.slice(2)+'</li>'}else{if(ul){h+='</ul>';ul=false}if(ln.trim())h+='<p>'+ln+'</p>'}}if(ul)h+='</ul>';return h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function stepsHTML(m,i){const allDone=m.steps.every(s=>s.s==='done'),collapsed=allDone&&!m.open;
 return `<div class="steps ${collapsed?'collapsed':''} ${m.open?'open':''}">${allDone?`<button class="sum" data-act="steps" data-i="${i}">${ic('checkc',15)}Worked for ${m.secs||'1.0'}s · ${m.steps.length} steps<span class="chv">${ic('chevD',15)}</span></button>`:`<div class="sum working"><span class="spin"></span>Zenith is working...</div>`}<div class="slist">${m.steps.map(s=>`<div class="step ${s.s}"><span class="si">${s.s==='done'?ic('check',15):s.s==='run'?'<span class="spin"></span>':'<i></i>'}</span>${s.l}</div>`).join('')}</div></div>`}

function extraHTML(m,i){if(!m.done)return '';let x='';
 if(m.src&&m.src.length)x+=`<div class="srcs">${m.src.map(s=>`<a class="src" data-go="${s.href}">${ic('book',13)}${esc(s.label)}</a>`).join('')}</div>`;
 if(m.quiz){const Q=QUIZ[m.quiz.i];x+=`<div class="quiz"><div class="qq">${esc(Q.q)}</div>${Q.o.map((o,k)=>{let cl='';if(m.quiz.p!=null){if(k===Q.a)cl='right';else if(k===m.quiz.p)cl='wrong'}return `<button class="qopt ${cl}" data-act="qpick" data-m="${i}" data-o="${k}" ${m.quiz.p!=null?'disabled':''}>${String.fromCharCode(65+k)}. ${esc(o)}</button>`}).join('')}${m.quiz.p!=null?`<div class="qfb"><b>${m.quiz.p===Q.a?'Correct!':'Not quite.'}</b> ${esc(Q.why)}</div>`:''}</div>`;
  if(m.quiz.p!=null)x+=`<div class="acts"><button class="btn soft sm" data-act="ask" data-q="Quiz me again">Another question</button></div>`}
 if(m.acts&&m.acts.length)x+=`<div class="acts">${m.acts.map(a=>a.href?`<button class="btn primary sm" data-go="${a.href}">${esc(a.label)} ${ic('arrowR',14)}</button>`:a.q?`<button class="btn soft sm" data-act="ask" data-q="${esc(a.q)}">${esc(a.label)}</button>`:`<button class="btn soft sm" data-act="${a.act}">${ic('calendar',14)}${esc(a.label)}</button>`).join('')}</div>`;
 return x}

function slot(el,k,h){if(el._c[k]!==h){el._c[k]=h;el.querySelector(`[data-s="${k}"]`).innerHTML=h}}
/* Incremental chat rendering: only the parts that changed are touched, so nothing flickers */
function syncChats(){document.querySelectorAll('[data-chat]').forEach(box=>{
  if(!CHAT.msgs.length){if(box.dataset.mode!=='w'){box.innerHTML=welcomeHTML();box.dataset.mode='w'}return}
  const fresh=box.dataset.mode!=='m';if(fresh){box.innerHTML='';box.dataset.mode='m'}
  const near=fresh||CHAT.stick||box.scrollHeight-box.scrollTop-box.clientHeight<140;
  while(box.children.length>CHAT.msgs.length)box.lastElementChild.remove();
  CHAT.msgs.forEach((m,i)=>{let el=box.children[i];
   if(!el){el=document.createElement('div');el.className='msg '+(m.role==='user'?'u':'a')+(fresh?'':' enter');el._c={};
    el.innerHTML=m.role==='user'?`<div class="bub">${esc(m.text)}</div>`:`<div class="aav">${ic('sparkle',15)}</div><div class="abody"><div data-s="st"></div><div data-s="bu"></div><div data-s="ex"></div></div>`;box.appendChild(el)}
   if(m.role!=='user'){slot(el,'st',stepsHTML(m,i));slot(el,'bu',bubHTML(m));slot(el,'ex',extraHTML(m,i))}});
  if(near)box.scrollTop=box.scrollHeight});
 CHAT.stick=false;
 document.querySelectorAll('[data-actlog]').forEach(el=>{const n=+(el.dataset.n||0),L=CHAT.log;if(n===L.length)return;
  el.insertAdjacentHTML('afterbegin',L.slice(n).map(l=>`<div class="alr${n?' enter':''}"><time>${l.t}</time>${ic('check',14)}<span>${esc(l.x)}</span></div>`).reverse().join(''));el.dataset.n=L.length});
 document.querySelectorAll('form[data-form=chat] .send').forEach(b=>b.disabled=CHAT.busy)}
function logAct(x){CHAT.log.push({t:nowT(),x})}

function openAI(){if(route()[0]!=='assistant')document.body.classList.add('aiw-open');setTimeout(()=>{const i=$('#aiw input');if(i&&innerWidth>860)i.focus()},50)}

const QUIZ=[
 {q:'A claimant calls upset that their payout is delayed. In the LEARN framework, what comes first?',o:['Explain the policy terms','Listen without interrupting','Offer a goodwill payment','Escalate to a manager'],a:1,why:'Listening first lowers the temperature and surfaces the real issue before you try to fix anything.'},
 {q:'Which is the strongest sign that a service recovery worked?',o:['The complaint was closed quickly','The customer renews and refers others','No further emails were received','The adjuster followed the script'],a:1,why:'This is the service recovery paradox: a well-handled failure can leave customers more loyal than before.'},
 {q:'Which wording is best in a claims decline letter?',o:['"Your claim is repudiated under clause 4(b)."','"We can\'t pay this claim because your policy excludes flood damage. Here is what you can do next."','"Unfortunately no payment will be made."','"Please refer to your policy schedule."'],a:1,why:'Plain language plus a clear next step reduces disputes and repeat calls.'},
 {q:'A rules engine flags a claim lodged 9 days after the policy started. What should happen next?',o:['Decline it automatically','Route it for closer review, not a decision','Ignore it, early claims are normal','Cancel the policy'],a:1,why:'Red flags trigger review, not verdicts. Most flagged claims turn out to be genuine.'}];

function respond(q){const s=q.toLowerCase();const act=activeCourses();
 const focus=act.slice().sort((a,b)=>pct(b)-pct(a))[0];
 const lessonLink=(c,i)=>({label:lessons(c)[i].title,href:`#/learn/${c.id}/${i}`});
 if(/^(hi|hello|hey|good (morning|afternoon|evening))\b/.test(s))return{steps:['Reading your message','Loading your learner profile'],text:`Hi Jane! I'm Zenith, your IIP Academy AI assistant. I can see your ${act.length} active courses, your ${overall()}% overall progress and your saved notes.\nAsk me to explain a concept, quiz you, or plan your study time.`,acts:[{label:'What should I study next?',q:'What should I study next?'},{label:'Quiz me',q:'Quiz me on service recovery'}]};
 if(/^explain/.test(s)){const m=q.match(/"([^"]+)"/);const name=m?m[1]:'this lesson';const c=course(S.last)||focus||COURSES[0];const T=takes(c);
  return{steps:[`Opening "${name}"`,`Reading lesson transcript and notes`,'Pulling out the key ideas','Writing a plain-language explanation'],text:`Here's **${name}** in a nutshell:\n- ${T[0]}\n- ${T[1]}\n- ${T[2]}\nA simple way to remember it: think about what the customer feels, what they need to know next, and what you will do about it.\nWant me to test you on it?`,src:[{label:c.title,href:'#/course/'+c.id}],acts:[{label:'Quiz me on this',q:'Quiz me again'}]}}
 if(/quiz|test me/.test(s)){const i=S.qi%QUIZ.length;S.qi++;save();return{steps:['Checking lessons you\'ve completed','Selecting a question at your level','Preparing answer options'],text:`Here's a quick knowledge check based on lessons you've completed. Pick an answer:`,quiz:{i,p:null}}}
 if(/certif/.test(s)){const c=focus;return{steps:['Checking certificate requirements','Counting remaining lessons'],text:`You've earned **${S.certs.length}** certificate${S.certs.length===1?'':'s'} so far.${c?`\nYou're closest to your next one in **${c.title}**: ${lessons(c).length-doneList(c).length} lessons left (${pct(c)}% done). Finish those and it unlocks automatically.`:''}`,src:[{label:'My certificates',href:'#/certificates'}],acts:c?[{label:'Continue that course',href:`#/learn/${c.id}/${nextLesson(c)}`}]:[]}}
 if(/next|continue|what should|where.*left|recommend/.test(s)){if(!focus)return{steps:['Checking your progress'],text:'You have finished all your enrolled courses. Nice work! Explore a new one to keep going.',acts:[{label:'Explore courses',href:'#/courses/explore'}]};
  const n=nextLesson(focus),L=lessons(focus),left=L.length-doneList(focus).length,mins=L.filter((l,i)=>!doneList(focus).includes(i)).reduce((a,l)=>a+l.dur,0);
  return{steps:[`Checking progress across ${act.length} courses`,'Finding your next unfinished lesson',`Reading Module ${L[n].mi+1}: ${focus.modules[L[n].mi][0]}`,'Estimating time to completion'],
  text:`You're closest to finishing **${focus.title}** (${pct(focus)}%).\nYour next lesson is **${L[n].title}** in Module ${L[n].mi+1}, about ${L[n].dur} minutes.\nYou have ${left} lessons left (roughly ${mins} minutes). At ${S.settings.goal} minutes a day you could finish in about ${Math.max(1,Math.ceil(mins/+S.settings.goal))} days and earn your next certificate.`,src:[lessonLink(focus,n)],acts:[{label:'Continue lesson',href:`#/learn/${focus.id}/${n}`},{label:'Plan my week',q:'Plan my study week'}]}}
 if(/plan|schedule|week|study time/.test(s)){const c=focus||COURSES[0];const L=lessons(c),rem=L.map((l,i)=>[l,i]).filter(x=>!doneList(c).includes(x[1]));const days=['Mon','Tue','Wed','Thu','Fri'];const per=Math.max(1,Math.ceil(rem.length/5));
  let lines=days.map((d,k)=>{const ch=rem.slice(k*per,(k+1)*per);return ch.length?`- **${d}:** ${ch.map(x=>x[0].title).join(', ')} (${ch.reduce((a,x)=>a+x[0].dur,0)} min)`:`- **${d}:** Review notes and post one insight in Community (15 min)`}).join('\n');
  return{steps:['Reading your daily goal and learning history','Finding your most productive time (evenings)',`Splitting ${rem.length} remaining lessons across 5 days`,'Building your plan'],text:`Here's a 5-day plan to finish **${c.title}**, built around your ${S.settings.goal}-minute daily goal:\n${lines}\nI'd schedule these for 7:30 PM, when you usually study.`,acts:[{label:'Add sessions to my calendar',act:'cal'},...(rem.length?[{label:'Start today\'s lesson',href:`#/learn/${c.id}/${rem[0][1]}`}]:[])]}}
 if(/angry|complain|upset|recover|apolog|difficult|claimant/.test(s)){const c=course('claims-comm');const L=lessons(c);const i=L.findIndex(l=>l.mi===4);
  return{steps:['Searching your courses for "difficult customers"','Found 2 relevant lessons','Reading Module 5: Service recovery frameworks','Composing an answer'],text:`Use the **LEARN** framework from your Claims Communication course:\n- **Listen** without interrupting. Let them finish.\n- **Empathise** with the feeling, e.g. "I understand how stressful this delay is."\n- **Apologise** for the experience, even if the decision stands.\n- **Resolve**: agree a specific next step and a date.\n- **Notify**: call back when you said you would, before they chase you.\nThe last step is the one most teams skip, and it's the one that rebuilds trust.`,src:[lessonLink(c,i),lessonLink(c,L.findIndex(l=>l.mi===3))],acts:[{label:'Quiz me on this',q:'Quiz me on service recovery'}]}}
 if(/fraud|red flag|suspicious/.test(s)){const c=course('ai-claims-fraud');const i=lessons(c).findIndex(l=>l.mi===2);
  return{steps:['Searching the fraud course library','Reading Module 3: Red flags and rules engines','Cross-checking recent Community discussions','Writing a summary'],text:`Common red flags to look out for:\n- Claims lodged soon after the policy starts or cover is increased\n- The same garage, clinic or witness appearing across unrelated claims\n- Documents with edited dates, mismatched fonts or sequential invoice numbers\n- Pressure for fast cash settlement and reluctance to allow inspections\n- Photo metadata (time, location) that doesn't match the reported incident\nRemember: a red flag means **review**, not reject. Module 3 of **${c.title}** shows how to turn these into scoring rules.`,src:[lessonLink(c,i),{label:'Community: invoice pattern post',href:'#/community'}],acts:[isEnrolled(c)?{label:pct(c)?'Continue fraud course':'Start fraud course',href:`#/learn/${c.id}/${pct(c)?nextLesson(c):i}`}:{label:'View course',href:'#/course/'+c.id}]}}
 if(/summar/.test(s)){let c=COURSES.find(x=>s.includes(x.title.toLowerCase()))||focus||COURSES[0];const T=takes(c);
  return{steps:[`Opening ${c.title}`,`Reading ${c.modules.length} module outlines`,'Summarising'],text:`**${c.title}** in brief:\n${c.desc}\nThe big ideas:\n- ${T[0]}\n- ${T[1]}\n- ${T[2]}\n${isEnrolled(c)?`You're ${pct(c)}% through.`:'You are not enrolled yet.'}`,src:[{label:c.title,href:'#/course/'+c.id}],acts:[isEnrolled(c)?{label:'Continue',href:`#/learn/${c.id}/${nextLesson(c)}`}:{label:'View course',href:'#/course/'+c.id}]}}
 if(/\bai\b|sales|lead scor|distribution|chatbot|bancassurance/.test(s)){const c=course('ai-sales');
  return{steps:['Searching AI for Insurance Sales','Reading Module 3: Lead scoring and propensity models','Composing an answer'],text:`Where AI helps most in insurance sales:\n- **Lead scoring:** ranks who to contact first, so agents spend time on likely buyers\n- **Next-best-offer:** suggests the right product for each customer's life stage\n- **Conversational service:** handles routine queries on WhatsApp or web, 24/7\n- **Agent enablement:** surfaces lapsed or forgotten customers\nAlways test against a control group and get clear consent for any partner data.`,src:[lessonLink(c,lessons(c).findIndex(l=>l.mi===2))],acts:[{label:'Continue AI for Sales',href:`#/learn/${c.id}/${nextLesson(c)}`}]}}
 return{steps:['Understanding your question',`Searching ${S.enrolled.length} courses and ${S.enrolled.map(course).reduce((a,c)=>a+lessons(c).length,0)} lessons`,'Ranking the most relevant material','Composing an answer'],text:`Good question. Here's what your courses say that's most relevant to "${q}":\n- ${takes(focus||COURSES[0])[0]}\n- ${takes(course('ai-claims-fraud'))[1]}\n- ${takes(course('ai-sales'))[0]}\nIf you tell me a bit more about your situation (your role or a recent case), I can give you a more specific answer.`,src:focus?[{label:focus.title,href:'#/course/'+focus.id}]:[],acts:[{label:'What should I study next?',q:'What should I study next?'}]}}

async function ask(q){q=q.trim();if(!q||CHAT.busy)return;CHAT.busy=true;
 CHAT.msgs.push({role:'user',text:q});const r=respond(q);
 const m={role:'agent',steps:r.steps.map(l=>({l,s:'pending'})),text:'',done:false,src:r.src,acts:r.acts,quiz:r.quiz};CHAT.msgs.push(m);CHAT.stick=true;syncChats();
 const t0=Date.now();logAct('Received question: "'+(q.length>40?q.slice(0,40)+'...':q)+'"');
 for(let k=0;k<m.steps.length;k++){const st=m.steps[k];st.s='run';syncChats();await sleep(550+Math.random()*650);st.s='done';if(k===m.steps.length-1)m.secs=((Date.now()-t0)/1000).toFixed(1);logAct(st.l);syncChats()}
 const toks=r.text.split(/(\s+)/);for(const t of toks){m.text+=t;if(t.trim()){syncChats();await sleep(16+Math.random()*24)}}
 m.done=true;CHAT.busy=false;logAct('Answer delivered'+(m.src&&m.src.length?' with '+m.src.length+' source'+(m.src.length>1?'s':''):''));syncChats()}

/* ---------- lesson player ---------- */
let PL=null;
function stopPlayer(){if(PL){clearInterval(PL.iv);PL=null}}
function togglePlay(el){const dur=+el.dataset.dur*60;if(!PL||PL.el!==el)PL={el,t:0,iv:null};
 if(PL.iv){clearInterval(PL.iv);PL.iv=null;el.classList.remove('playing');$('#pbtn').innerHTML=ic('play',34);return}
 el.classList.add('playing');$('#pbtn').innerHTML=ic('pause',30);
 PL.iv=setInterval(()=>{PL.t=Math.min(dur,PL.t+dur/120);const f=PL.t/dur;const b=$('#pbar'),tm=$('#ptime');if(!b){stopPlayer();return}b.style.width=(f*100)+'%';tm.textContent=String(Math.floor(PL.t/60)).padStart(2,'0')+':'+String(Math.floor(PL.t%60)).padStart(2,'0');
  if(f>=1){clearInterval(PL.iv);PL.iv=null;el.classList.remove('playing');$('#pbtn').innerHTML=ic('check',34);toast('Video finished. Mark the lesson complete when ready.')}},100)}

/* ---------- actions ---------- */
function completeLesson(id,i){const c=course(id),L=lessons(c);const d=S.done[id]=S.done[id]||[];let newly=false;
 if(!d.includes(i)){d.push(i);newly=true;S.minutes[2]+=L[i].dur;S.activity.unshift({t:`Completed "${L[i].title}"`,w:'Just now'})}
 save();
 if(newly&&pct(c)===100&&!S.certs.find(x=>x.id===id)){S.certs.push({id,date:todayStr(),code:'IIP-2026-'+String(1000+Math.floor(Math.random()*8999))});S.notifs.unshift({t:'You earned a certificate: '+c.title,time:'Just now',href:'#/certificate/'+id,icon:'award',read:false});save();
  go('#/course/'+id);celebrate(c);return}
 if(newly)toast('Lesson complete. +'+L[i].dur+' minutes today');
 go(i<L.length-1?`#/learn/${id}/${nextUndone(c,i)}`:`#/course/${id}`)}
function nextUndone(c,i){const d=doneList(c),L=lessons(c);for(let j=i+1;j<L.length;j++)if(!d.includes(j))return j;return Math.min(i+1,L.length-1)}
function celebrate(c){const box=document.createElement('div');box.className='confetti';const cols=['#F5A524','#0B4FE0','#12A150','#E5484D','#7A2E8C'];for(let k=0;k<80;k++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[k%5];p.style.animationDelay=Math.random()*.8+'s';box.appendChild(p)}document.body.appendChild(box);setTimeout(()=>box.remove(),3600);
 showModal(`<div class="seal">${ic('award',40)}</div><h2>Certificate earned!</h2><p>You've completed <b>${c.title}</b>. Your certificate is ready to view and share.</p><div class="btns"><button class="btn primary" data-act="closemodal" data-go="#/certificate/${c.id}">View certificate</button><button class="btn ghost" data-act="closemodal">Later</button></div>`)}
function showModal(h,cls=''){const b=$('#mbox');b.className='mbox '+cls;b.innerHTML=h;$('#modal').classList.add('show')}
function rerenderPosts(){const el=$('#posts');if(el){render()}}

const ACT={
 menu:(el,e)=>{if(e.target.closest('.menu a'))return;el.classList.toggle('open')},
 openai:()=>openAI(),closeai:()=>document.body.classList.remove('aiw-open'),
 minitoggle:()=>$('#aimini').classList.toggle('collapsed'),
 scroll:(el)=>{const r=$('#crow');if(!r)return;const end=r.scrollLeft+r.clientWidth>=r.scrollWidth-5;r.scrollLeft=end?0:r.scrollLeft+r.clientWidth*.68;el.innerHTML=ic(end?'chevR':'chevR',22)},
 ask:(el)=>{const q=el.dataset.q;$('#modal').classList.remove('show');openAI();ask(q)},
 steps:(el)=>{const m=CHAT.msgs[+el.dataset.i];m.open=!m.open;syncChats()},
 qpick:(el)=>{const m=CHAT.msgs[+el.dataset.m];if(m.quiz.p!=null)return;m.quiz.p=+el.dataset.o;logAct(m.quiz.p===QUIZ[m.quiz.i].a?'Quiz answer marked correct':'Quiz answer marked incorrect, explanation shown');syncChats()},
 newchat:()=>{if(CHAT.busy)return;CHAT.msgs=[];logAct('Started a new conversation');syncChats()},
 cal:()=>{logAct('Created 5 study sessions in calendar (7:30 PM)');syncChats();toast('5 study sessions added to your calendar','calendar')},
 enroll:(el)=>{CK={id:el.dataset.id,m:'momo'};showModal(ckHTML(),'left')},
 pm:(el)=>{CK.m=el.dataset.m;$('#mbox').innerHTML=ckHTML()},
 pay:async()=>{const c=course(CK.id),card=CK.m==='card';$('#mbox').className='mbox';$('#mbox').innerHTML=`<div class="bigspin"></div><h2>${card?'Processing payment':'Confirm on your phone'}</h2><p>${card?'Securely processing your card...':`Approve the UGX ${fmtP(c.price)} request on your phone and enter your PIN.`}</p>`;await sleep(2000);doEnroll(CK.id);
  $('#mbox').innerHTML=`<div class="seal ok">${ic('check',40)}</div><h2>You're enrolled!</h2><p>Payment received. <b>${c.title}</b> is now unlocked.</p><div class="btns"><button class="btn primary" data-act="closemodal" data-go="#/learn/${c.id}/0">Start learning ${ic('arrowR',16)}</button><button class="btn ghost" data-act="closemodal">Later</button></div>`;render()},
 groups:()=>{GSEL=new Set(S.groups.filter(g=>g.j).map(g=>g.id));showModal(gHTML(),'left wide')},
 gsel:(el)=>{const id=el.dataset.id;GSEL.has(id)?GSEL.delete(id):GSEL.add(id);$('#mbox').innerHTML=gHTML()},
 gjoin:()=>{let added=0;S.groups.forEach(g=>{const w=g.j;g.j=GSEL.has(g.id);if(g.j&&!w){g.m++;added++}if(!g.j&&w)g.m--});save();$('#modal').classList.remove('show');render();toast(added?`Joined ${added} group${added>1?'s':''}. Welcome in!`:'Groups updated','users')},
 fs:(el,e)=>{const p=$('#player');const fail=()=>toast('Full screen is blocked in this preview. Open the file in your browser.','expand');try{const r=document.fullscreenElement?document.exitFullscreen():(p.requestFullscreen||p.webkitRequestFullscreen).call(p);if(r&&r.catch)r.catch(fail)}catch(err){fail()}},


 play:(el)=>togglePlay(el),
 complete:(el)=>completeLesson(el.dataset.id,+el.dataset.i),
 savenote:(el)=>{S.notes[el.dataset.k]=$('#note').value;save();toast('Note saved')},
 like:(el)=>{const p=S.posts.find(x=>x.id==el.dataset.id);p.liked=!p.liked;p.likes+=p.liked?1:-1;save();render()},
 togc:(el)=>{const id=+el.dataset.id;openC.has(id)?openC.delete(id):openC.add(id);render()},
 share:()=>{toast('Link copied to clipboard')},
 post:()=>{const t=$('#newpost').value.trim();if(!t){toast('Write something first','pen');return}S.posts.unshift({id:Date.now(),a:'Jane Doe',r:'Customer Experience Officer, Equator General',time:'Just now',tag:$('#newtag').value,likes:0,liked:false,text:t,c:[]});S.activity.unshift({t:'Posted in Community',w:'Just now'});commTab='latest';save();render();toast('Posted to the community')},
 ctab:(el)=>{commTab=el.dataset.t;render()},

 rsvp:(el)=>{const ev=S.events.find(x=>x.id===el.dataset.id);ev.r=!ev.r;save();render();toast(ev.r?'You\'re going to '+ev.t:'RSVP cancelled','calendar')},
 notif:(el)=>{const n=S.notifs[+el.dataset.i];n.read=true;save();go(n.href)},
 readall:()=>{S.notifs.forEach(n=>n.read=true);save();render();toast('All caught up')},
 savesettings:()=>{save();toast('Settings saved')},
 reset:()=>{if(confirm('Reset all demo progress, posts and notes?')){S=fresh();save();CHAT.msgs=[];render();toast('Demo data reset')}},
 print:()=>window.print(),
 sharecert:()=>{try{navigator.clipboard.writeText('https://academy.iip.example/verify/'+(S.certs[0]||{}).code)}catch(e){}toast('Credential link copied')},
 closemodal:()=>$('#modal').classList.remove('show')
};
document.addEventListener('click',e=>{
 const um=$('#userMenu');if(!e.target.closest('#userMenu'))um.classList.remove('open');
 if(e.target.id==='modal'){$('#modal').classList.remove('show');return}
 const a=e.target.closest('[data-act]'),g=e.target.closest('[data-go]');
 const goInside=g&&a&&a!==g&&a.contains(g);
 if(a&&!goInside){const fn=ACT[a.dataset.act];if(fn){fn(a,e);if(!(g&&a===g))return}}
 if(goInside)$('#userMenu').classList.remove('open');
 if(g){e.preventDefault();const h=g.dataset.go;go(h);if(innerWidth<=860&&h==='#/assistant')document.body.classList.remove('aiw-open')}
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const k=f.dataset.form,inp=f.querySelector('input');
 if(k==='chat'||k==='mini'){const v=inp.value;inp.value='';if(k==='mini')openAI();ask(v)}
 else if(k==='comment'){const v=inp.value.trim();if(!v)return;const p=S.posts.find(x=>x.id==f.dataset.id);p.c.push({a:'Jane Doe',t:v});save();render();toast('Comment added')}
 else if(k==='signin'){go('#/dashboard');toast('Welcome back, Jane')}});
document.addEventListener('input',e=>{if(e.target.dataset.input==='csearch'){cSearch=e.target.value;const f=route()[1]||'all',list=courseFilter(f);$('#cgridList').innerHTML=list.length?list.map(courseCard).join(''):`<div class="empty" style="grid-column:1/-1">No courses match "${esc(cSearch)}".</div>`}});
document.addEventListener('change',e=>{const k=e.target.dataset.set;if(!k)return;S.settings[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;save()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('aiw-open');$('#modal').classList.remove('show')}});

initStatic();
render();
</script>
</body>
