plugins {
    id "com.android.application"
}

android {
    namespace "com.otic.iip"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.otic.iip"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "START_URL", "\"https://app-portal-dev-h5girbnzrayqe.azurewebsites.net/app/workspace\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}
